name: AntiArmorTrim
version: 2.6.0
main: com.server.antitrim.AntiArmorTrim
api-version: '1.21'
author: LeThienNhan
softdepend: [LuckPerms, Nexo, ModelEngine, Essentials, PerPlayerKit]
description: Catppuccin Decoration Studio - Armor Trim, Nexo Hats, ModelEngine KillEffects, KillSounds & Item Rename.

commands:
  antitrim:
    description: Admin command for AntiArmorTrim
    aliases: [at, vctrim]
  decor:
    description: Open the Decoration Studio Hub GUI
    aliases: [cosmetics, studio]
  trim:
    description: Open the Armor Trim Studio GUI
    aliases: [armortrim, trims]
  hat:
    description: Open the Custom Hat Studio GUI
    aliases: [hats, customhat]
  killeffect:
    description: Open the KillEffect Studio GUI
    aliases: [ke, kfx, killeffects]
  killsound:
    description: Open the KillSound Studio GUI
    aliases: [ks, killsounds]
  rename:
    description: Open the Item Rename Studio GUI or rename held item
    aliases: [itemrename]

permissions:
  armortrim.bypass:
    description: Allows owning, wearing, and using the Auto-Trim GUI Studio.
    default: op
  armortrim.hat:
    description: Allows equipping general Nexo Custom Hats on Diamond and Netherite helmets.
    default: op
  armortrim.killeffect:
    description: Allows equipping general ModelEngine 3D KillEffects.
    default: op
  armortrim.killsound:
    description: Allows equipping general Nexo KillSounds.
    default: op
  armortrim.rename:
    description: Allows renaming items and holding custom-renamed items.
    default: op
  armortrim.admin:
    description: Allows reloading config and managing Hats, KillEffects & KillSounds via Admin GUI.
    default: op
