name: AntiArmorTrim
version: 2.1.0
main: com.server.antitrim.AntiArmorTrim
api-version: '1.21'
author: LeThienNhan
softdepend: [LuckPerms]
description: Armor Trim restriction and Catppuccin Auto-Trim GUI Studio.

commands:
  antitrim:
    description: Admin command for AntiArmorTrim
    aliases: [at, vctrim]
    permission: armortrim.admin
  trim:
    description: Open the Armor Trim Studio GUI
    aliases: [armortrim, trims]

permissions:
  armortrim.bypass:
    description: Allows owning, wearing, and using the Auto-Trim GUI Studio.
    default: op
  armortrim.admin:
    description: Allows reloading the plugin configuration.
    default: op
    
