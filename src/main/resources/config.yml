# +-------------------------------------------------------------------+ #
# |                   AntiArmorTrim Configuration                     | #
# |                  Theme: Catppuccin Mocha Palette                  | #
# +-------------------------------------------------------------------+ #

luckperms:
  auto-detect-rank: true
  fallback-rank: "<#f9e2af><bold>VIP</bold>"

gui:
  decor-title: "<#cba6f7><bold>Decoration Studio</bold>"
  main-title: "<#cba6f7><bold>Armor Trim Studio</bold>"
  slot-title: "<#cba6f7><bold>Trim Editor:</bold> <#74c7ec><slot>"
  rename-title: "<#cba6f7><bold>Item Rename Studio</bold>"

  status-selected: "<#a6e3a1>● Selected"
  status-unselected: "<#6c7086>○ Unselected"

  no-permission-lore:
    - ""
    - "<#f38ba8>✖ Locked"
    - "<#a6adc8>Required Rank: <rank>"

rename:
  max-length: 48

messages:
  # Clean messages without prefix, using 1.21.11 Sprite Object Components
  remove-trim: "<sprite:blocks:item/barrier> <#f38ba8>You do not have permission to wear trimmed armor."
  deny-smith: "<sprite:blocks:item/barrier> <#f38ba8>You are not allowed to apply armor trims!"
  no-permission-gui: "<sprite:blocks:item/barrier> <#f38ba8>Locked feature! Required rank: <rank>"

  # Trim Studio feedback
  trim-selected: "<pattern_icon> <#cdd6f4>Applied <#f9e2af><pattern> <#6c7086>(<material_icon> <#fab387><material><#6c7086>) <#cdd6f4>to <#74c7ec><slot><#cdd6f4>."
  trim-applied-all: "<pattern_icon> <#cdd6f4>Synced <#f9e2af><pattern> <#6c7086>(<material_icon> <#fab387><material><#6c7086>) <#cdd6f4>to all <#cba6f7>4 armor pieces<#cdd6f4>."
  trim-cleared: "<sprite:blocks:item/barrier> <#fab387>Cleared active trim for <#74c7ec><slot><#fab387>."
  trim-missing-selection: "<sprite:blocks:item/barrier> <#f38ba8>Select both a <#89dceb>Pattern<#f38ba8> and a <#fab387>Material<#f38ba8> first."

  # Rename Studio feedback
  rename-prompt: "<sprite:blocks:item/name_tag> <#89dceb>Type the new item name in chat, or type <#f38ba8>cancel<#89dceb>."
  rename-cancelled: "<sprite:blocks:item/arrow> <#fab387>Item rename cancelled."
  rename-no-item: "<sprite:blocks:item/barrier> <#f38ba8>Hold an item in your <#f9e2af>Main Hand<#f38ba8> to rename it."
  rename-too-long: "<sprite:blocks:item/barrier> <#f38ba8>Name is too long! Max length: <#f9e2af><max><#f38ba8> characters."
  rename-success: "<sprite:blocks:item/name_tag> <#a6e3a1>Renamed item to: <name>"
  rename-reset: "<sprite:blocks:item/name_tag> <#fab387>Reset held item name to default."

  # System messages
  reload-success: "<sprite:blocks:item/nether_star> <#a6e3a1>Configuration reloaded."
  no-permission: "<sprite:blocks:item/barrier> <#f38ba8>You do not have permission to use this command."
  only-players: "<#f38ba8>This command can only be used in-game."
  usage: "<#fab387>Usage: <#f9e2af>/<label> reload"
  
